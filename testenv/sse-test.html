<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Suricata SSE — тест</title>
<style>
 body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;margin:24px;background:#0f172a;color:#e2e8f0}
 h1{font-size:20px}
 #status{padding:4px 10px;border-radius:999px;font-size:13px;display:inline-block}
 .ok{background:#14532d;color:#86efac}.bad{background:#7f1d1d;color:#fca5a5}
 table{border-collapse:collapse;width:100%;margin-top:16px;font-size:13px}
 th,td{border:1px solid #334155;padding:6px 10px;text-align:left}
 th{background:#1e293b}
 .sev1{color:#f87171;font-weight:bold}.sev2{color:#fbbf24;font-weight:bold}.sev3{color:#4ade80}
</style>
</head>
<body>
<h1>Алерты Suricata (SSE)&ensp;<span id="status" class="bad">подключение...</span></h1>
<table>
 <thead><tr><th>timestamp</th><th>source_ip</th><th>dest_port</th><th>signature</th><th>severity</th></tr></thead>
 <tbody id="rows"></tbody>
</table>
<script>
const host = new URLSearchParams(location.search).get("host") || "localhost";
const port = new URLSearchParams(location.search).get("port") || "8080";
const es = new EventSource(`http://${host}:${port}/events`);
const st = document.getElementById("status");
es.onopen  = () => { st.textContent = "подключено"; st.className = "ok"; };
es.onerror = () => { st.textContent = "обрыв (переподключаюсь...)"; st.className = "bad"; };
es.onmessage = (e) => {
  const a = JSON.parse(e.data);
  const tr = document.createElement("tr");
  for (const k of ["timestamp","source_ip","dest_port","signature","severity"]) {
    const td = document.createElement("td");
    td.textContent = a[k];
    if (k === "severity") td.className = "sev" + a[k];
    tr.appendChild(td);
  }
  document.getElementById("rows").prepend(tr);
};
</script>
</body>
</html>
